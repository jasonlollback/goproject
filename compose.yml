# goproject.lollback.com, deployed by moin: every push to main goes live.
# https://moin.run/docs/guides/config
x-moin:
  app: goproject
  port: 8090
  health: /healthz
  domains: [goproject.lollback.com, www.goproject.lollback.com]
  canonical: goproject.lollback.com

services:
  site:
    build:
      context: .
      dockerfile: site/Dockerfile
